<section class="education">
    <h2 class="education__title">{{title}}</h2>

    <div class="education__container">
        <div class="education__group">
            <h4 class="education__group-title">{{educationLabel}}</h4>
            <div class="education__group-info">
                <h4 class="education__card-title">{{university}}</h4>
                <p class="education__card-role">{{role}}</p>
                <p class="education__card-period">{{period}}</p>
            </div>
        </div>

        <div class="education__group">
            <h4 class="education__group-title">{{certificationsLabel}}</h4>

            <div class="education__certifications">
                {{#each certifications}}
                    <div class="education__certification-card">
                        <h4 class="education__card-title">{{title}}</h4>
                        <p class="education__card-org">{{organization}}</p>
                        <p class="education__card-topic">{{topic}}</p>
                    </div>
                {{/each}}
            </div>
        </div>
    </div>

    <div class="education__more-btn">
        <a href="{{linkedinUrl}}" class="education__more-link">
            <img src="{{linkedinIcon}}" alt="LinkedIn icon" class="education__more-link-icon">
            {{moreInfoLabel}}
        </a>
    </div>
</section>
