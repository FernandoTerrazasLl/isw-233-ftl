<section class="about">
    {{> section-title className="about__title" text=title}}

    <div class="about__content">
        <div class="about__info">
            <div class="about__images">
                <img src="{{profilePhoto}}" alt="Profile photo" class="about__photo">
                <img src="{{backgroundImage}}" alt="Background image" class="about__fernando-bg">
            </div>
            <p class="about__image-description about__image-name">{{profileName}}</p>
            <p class="about__image-description">{{profileRole}}</p>
        </div>
        <div class="about__text">
            <p class="about__description">{{description}}</p>
        </div>
    </div>
</section>
