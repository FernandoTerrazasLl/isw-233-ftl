<section class="projects">
    <h2 class="projects__title">{{title}}</h2>
    <p class="projects__subtitle">{{subtitle}}</p>

    <div class="projects__container">
        {{#each projects}}
            <div class="projects__project">
                <img src="{{image}}" alt="{{imageAlt}}" class="projects__project-image">
                <div class="projects__project-info">
                    <h4 class="projects__project-title">{{title}}</h4>
                    <a href="{{url}}" class="projects__project-link">
                        <img src="{{repositoryIcon}}" alt="GitHub icon" class="projects__project-link-icon"> {{../repositoryLabel}}
                    </a>
                </div>
            </div>
        {{/each}}
    </div>

    <a href="{{moreProjectsUrl}}" class="projects__more-link">
        <div class="projects__more-btn">
            <img src="{{moreProjectsIcon}}" alt="GitHub icon" class="projects__github-more-btn">
            {{moreProjectsLabel}}
        </div>
    </a>
</section>
