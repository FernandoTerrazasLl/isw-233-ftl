<section class="blog">
    <h2 class="blog__title">{{title}}</h2>
    <div class="blog__search">
        <div class="blog__search-container">
            <input type="text" placeholder="{{searchPlaceholder}}" class="blog__search-input">
            <button class="blog__search-button">{{searchLabel}}</button>
        </div>
        <button class="blog__categories-button">{{categoriesLabel}}</button>
        <div class="blog__categories-list"></div>
    </div>

    <div class="blog__container"><!-- here we load the posts --></div>
</section>
