<section class="home">
    <div class="home__background">
        <div class="home__intro">
            <h1>{{name}}</h1>
            <p class="home__profession">{{profession}}</p>
            {{#each phrases}}
                <p class="home__phrase">{{this}}</p>
            {{/each}}
        </div>
        <div class="home__social-media">
            {{#each socialLinks}}
                {{> social-link-item
                    href=href
                    linkClass="home__social-link"
                    iconSrc=iconSrc
                    iconAlt=iconAlt
                }}
            {{/each}}
        </div>

        <div class="home__contact">
            <a class="home__contact-link" href="mailto:terrazasllanosfernando@gmail.com">Contact Me</a>
        </div>
    </div>
</section>
